name: Plaud
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

# Schemes explicites (sinon xcodegen n'en génère pas → schemes perdus à chaque régénération).
schemes:
  Plaud:
    build:
      targets:
        Plaud: all
    run:
      config: Debug
  PlaudiOS:
    build:
      targets:
        PlaudiOS: all
    run:
      config: Debug

targets:
  # ---------------------------------------------------------------------------
  # macOS — Plaud Companion (cible historique)
  # ---------------------------------------------------------------------------
  Plaud:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PlaudApp
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Info-iOS.plist"
          # Artefacts d'outils (hooks OMC) parfois déposés dans les sous-dossiers
          # source : à ne jamais embarquer comme ressources du bundle.
          - "**/.omc/**"
    # Sparkle (auto-update) : cible macOS uniquement — le framework n'existe pas sur iOS.
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Plaud Companion
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.Plaud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: PlaudApp/Plaud.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: PlaudApp/Info.plist
      properties:
        CFBundleName: Plaud Companion
        CFBundleDisplayName: Plaud Companion
        CFBundleIdentifier: fr.vincentlauriat.Plaud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # Sparkle 2 — auto-update. La clé publique EdDSA correspond à la clé privée
        # du trousseau (compte "PlaudCompanion") utilisée par sign_update dans
        # Scripts/release.sh. NE JAMAIS régénérer la paire ni changer cette valeur :
        # toutes les installations existantes refuseraient les mises à jour.
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/plaud-companion/main/appcast.xml"
        SUPublicEDKey: "ZnGc6Y+TEvjSxkaf3WkQc5YHIZv31qMP/VyNSL15s8w="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400

  # ---------------------------------------------------------------------------
  # iOS / iPadOS — Plaud Companion (codebase partagé avec la cible macOS)
  # ---------------------------------------------------------------------------
  PlaudiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlaudApp
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Info-iOS.plist"
          # Artefacts d'outils (hooks OMC) parfois déposés dans les sous-dossiers
          # source : à ne jamais embarquer comme ressources du bundle.
          - "**/.omc/**"
    settings:
      base:
        PRODUCT_NAME: Plaud Companion
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.Plaud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signature automatique gérée dans Xcode (Apple ID perso).
        # Le build de vérification simulateur passe CODE_SIGNING_ALLOWED=NO en argument.
        CODE_SIGN_STYLE: Automatic
    info:
      path: PlaudApp/Info-iOS.plist
      properties:
        CFBundleName: Plaud Companion
        CFBundleDisplayName: Plaud Companion
        CFBundleIdentifier: fr.vincentlauriat.Plaud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
